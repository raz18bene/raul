<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - TechLab</title>
    <link rel="stylesheet" href="../static/styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: var(--bg-card);
            backdrop-filter: var(--blur-md);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 3rem;
            max-width: 450px;
            width: 100%;
            box-shadow: var(--shadow-lg);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2.5rem;
            box-shadow: 0 8px 32px rgba(0, 217, 255, 0.3);
        }

        .login-header h1 {
            font-family: var(--font-display);
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .login-form {
            margin-top: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-family: var(--font-display);
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background: rgba(10, 14, 39, 0.5);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--bg-dark);
            border: none;
            border-radius: 8px;
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 217, 255, 0.3);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 217, 255, 0.5);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-message {
            background: rgba(245, 101, 101, 0.1);
            color: var(--error);
            border: 1px solid var(--error);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none;
            font-size: 0.9rem;
        }

        .error-message.show {
            display: block;
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            color: var(--primary);
        }

        .security-note {
            background: rgba(0, 217, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            margin-top: 2rem;
            text-align: center;
        }

        .security-note p {
            color: var(--text-secondary);
            font-size: 0.85rem;
            line-height: 1.6;
            margin: 0;
        }

        .security-note strong {
            color: var(--primary);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Anti-flash: clasa pe <html> aplicată sincron înainte de render */
        html.light-mode-pending body,
        html.light-mode-pending {
            background: #edf6ff !important;
        }
    </style>
    <script>
        // Anti-flash: aplică tema SINCRON înainte de orice render
        (function(){
            try {
                if(localStorage.getItem('theme')==='light'){
                    document.documentElement.classList.add('light-mode-pending');
                }
            }catch(e){}
        })();
    </script>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-icon">👤</div>
            <h1>Admin Panel</h1>
            <p class="login-subtitle">
                <strong>Acces restricționat</strong><br>
                Această secțiune este dedicată exclusiv administratorilor.<br>
                Clienții nu au acces la acest panou.
            </p>
        </div>

        <div class="error-message" id="error-message">
            ❌ Username sau parolă incorectă!
        </div>

        <form class="login-form" id="login-form">
            <div class="form-group">
                <label for="username">👤 Username</label>
                <input 
                    type="text" 
                    id="username" 
                    placeholder="Introdu username-ul"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">🔒 Password</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Introdu parola"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                🔓 Intră în Admin Panel
            </button>
        </form>

        <div class="security-note">
            <p>
                <strong>🔒 Securitate</strong><br>
                Datele de autentificare sunt confidențiale.<br>
                Nu partaja aceste informații cu nimeni.
            </p>
        </div>

        <div class="back-link">
            <a href="../index.html">← Înapoi la site</a>
        </div>
    </div>

    <script>
        // Init Supabase client din /api/config
        let supabaseClient = null;
        async function initSupabase() {
            if (supabaseClient) return supabaseClient;
            const res = await fetch('/api/config');
            const cfg = await res.json();
            supabaseClient = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
            return supabaseClient;
        }

        // Verifică dacă userul e deja logat
        (async () => {
            const sb = await initSupabase();
            const { data: { session } } = await sb.auth.getSession();
            if (session) window.location.href = 'index.html';
        })();

        // Handle login form
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email    = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-message');

            try {
                const sb = await initSupabase();
                const { data, error } = await sb.auth.signInWithPassword({ email, password });

                if (error || !data.session) throw new Error(error?.message || 'Login eșuat');

                // Verifică dacă are rol admin în metadata
                const role = data.user?.app_metadata?.role || data.user?.user_metadata?.role;
                if (role !== 'admin') {
                    await sb.auth.signOut();
                    throw new Error('Nu ai permisiuni de admin.');
                }

                window.location.href = 'index.html';

            } catch(err) {
                console.error('Auth error:', err);
                errorMsg.textContent = err.message || 'Credentiale incorecte';
                errorMsg.classList.add('show');
                document.querySelector('.login-container').style.animation = 'shake 0.5s';
                setTimeout(() => {
                    document.querySelector('.login-container').style.animation = '';
                    errorMsg.classList.remove('show');
                }, 3000);
            }
        });

        // Shake animation CSS
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-10px); }
                75% { transform: translateX(10px); }
            }
        `;
        document.head.appendChild(style);
    </script>
    <!-- cookie-banner not needed in admin -->
</body>
</html>
