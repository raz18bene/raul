<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <script>
        // Anti-flash FOUC fix - rulează SINCRON înainte de orice render
        (function(){
            try {
                if(localStorage.getItem('theme')==='light'){
                    document.documentElement.setAttribute('data-theme','light');
                }
            }catch(e){}
        })();
    </script>
    <style>
        /* Critical light-mode CSS inline - fără flash */
        [data-theme="light"] {
            background: #edf6ff !important;
        }
        [data-theme="light"] body {
            background: #edf6ff !important;
            color: #0a1628 !important;
        }
        [data-theme="light"] .main-nav {
            background: rgba(237,246,255,0.95) !important;
        }
        [data-theme="light"] .grid-item,
        [data-theme="light"] .product-card,
        [data-theme="light"] .category-card,
        [data-theme="light"] .feature-card,
        [data-theme="light"] .service-item,
        [data-theme="light"] .accordion-header,
        [data-theme="light"] .checkout-section,
        [data-theme="light"] .order-summary,
        [data-theme="light"] .filter-bar,
        [data-theme="light"] .modal-content {
            background: #ffffff !important;
            color: #0a1628 !important;
        }
        [data-theme="light"] .hero-section {
            background: linear-gradient(135deg, #edf6ff 0%, #d6eeff 100%) !important;
        }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produs - TechNest</title>
    <link rel="stylesheet" href="static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .product-page { max-width: 1100px; margin: 6rem auto 4rem; padding: 0 2rem; }
        .product-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: start; }
        .product-gallery { position: static; }
        .main-image { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 16px; border: 1px solid var(--border); background: var(--bg-card); }
        .thumb-row { display: flex; gap: 0.75rem; margin-top: 0.75rem; flex-wrap: wrap; }
        .thumb { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; border: 2px solid var(--border); cursor: pointer; transition: border-color 0.2s; }
        .thumb.active, .thumb:hover { border-color: var(--primary); }
        .product-details h1 { font-family: var(--font-display); font-size: 2rem; color: var(--text-primary); margin-bottom: 0.5rem; line-height: 1.2; }
        .product-sku { color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 1.5rem; }
        .price-block { margin: 1.5rem 0; }
        .price-main { font-family: var(--font-display); font-size: 2.5rem; font-weight: 800; color: var(--primary); }
        .price-original { text-decoration: line-through; color: var(--text-secondary); font-size: 1.1rem; margin-left: 0.5rem; }
        .stock-badge { display: inline-block; padding: 0.3rem 0.8rem; border-radius: 6px; font-size: 0.9rem; font-weight: 600; margin-bottom: 1.5rem; }
        .stock-ok { background: rgba(34,197,94,0.15); color: #22c55e; }
        .stock-low { background: rgba(255,152,0,0.15); color: #ff9800; }
        .stock-out { background: rgba(239,68,68,0.15); color: #ef4444; }
        .description { color: var(--text-secondary); line-height: 1.7; margin: 1.25rem 0; font-size: 1rem; }
        .qty-add { display: flex; gap: 1rem; align-items: center; margin-top: 1.5rem; flex-wrap: wrap; }
        .qty-control { display: flex; align-items: center; border: 2px solid var(--border); border-radius: 10px; overflow: hidden; }
        .qty-control button { width: 42px; height: 48px; background: var(--bg-card); border: none; color: var(--text-primary); font-size: 1.3rem; cursor: pointer; transition: background 0.2s; }
        .qty-control button:hover { background: var(--bg-darker); }
        .qty-control span { width: 48px; text-align: center; font-weight: 700; font-size: 1.1rem; }
        .btn-add-big { flex: 1; min-width: 180px; padding: 0.9rem 1.5rem; font-size: 1rem; font-weight: 700; background: linear-gradient(135deg, var(--primary), var(--accent)); color: #000; border: none; border-radius: 10px; cursor: pointer; transition: opacity 0.2s; }
        .btn-add-big:hover { opacity: 0.9; }
        .btn-add-big:disabled { opacity: 0.4; cursor: not-allowed; }
        .back-link { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); text-decoration: none; margin-bottom: 2rem; font-size: 0.95rem; transition: color 0.2s; }
        .back-link:hover { color: var(--primary); }
        .specs-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        .specs-table td { padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
        .specs-table td:first-child { color: var(--text-secondary); width: 40%; }
        .specs-table td:last-child { color: var(--text-primary); font-weight: 500; }
        .section-title { font-family: var(--font-display); font-size: 1.2rem; color: var(--primary); margin: 2rem 0 0.75rem; border-left: 3px solid var(--primary); padding-left: 0.75rem; }
        @media (max-width: 768px) {
            .product-layout { grid-template-columns: 1fr; }
            .product-gallery { position: static; }
            .price-main { font-size: 2rem; }
        }
    </style>
</head>
<body>
<div class="logo-corner">
    <a href="index.html" style="text-decoration:none;color:inherit;">
        <span style="font-family:'JetBrains Mono',monospace;font-size:1.5rem;font-weight:800;letter-spacing:-0.03em;color:var(--text-primary);text-shadow:0 0 20px rgba(249,115,22,0.4);">Tech<span style="color:var(--primary);">Nest</span></span>
    </a>
</div>

<nav class="main-nav">
    <div class="nav-container">
        <ul class="nav-links">
            <li><a href="index.html" class="nav-link">Acasă</a></li>
            <li><a href="about.html" class="nav-link">Despre Noi</a></li>
            <li><a href="filamente.html" class="nav-link">Filamente</a></li>
            <li><a href="componente.html" class="nav-link">Componente</a></li>
            <li><a href="print3d.html" class="nav-link">Print 3D</a></li>
            <li><a href="accesorii-bambu.html" class="nav-link">Accesorii Imprimante 3D</a></li>
            <li><a href="contact.html" class="nav-link">Contact</a></li>
        </ul>
        <button id="theme-toggle" onclick="toggleTheme()" style="background:none;border:1px solid var(--border);border-radius:8px;padding:0.4rem 0.7rem;cursor:pointer;color:var(--text-primary);font-size:1rem;margin-right:0.5rem;transition:all 0.2s;">🌙</button>
        <a href="checkout.html" class="cart-icon">🛒 Coș<span class="cart-count">0</span></a>
        <button class="hamburger" id="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
</nav>

<div class="product-page">
    <a href="javascript:history.back()" class="back-link">← Înapoi</a>

    <div id="loading-state" style="text-align:center;padding:4rem;color:var(--text-secondary);">
        <div style="font-size:2rem;margin-bottom:1rem;">⏳</div>
        Se încarcă produsul...
    </div>

    <div id="product-content" style="display:none;">
        <div class="product-layout">
            <!-- Galerie -->
            <div class="product-gallery">
                <img id="main-img" class="main-image" src="" alt="">
                <div class="thumb-row" id="thumb-row"></div>

                <!-- Descriere - sub poza -->
                <p class="description" id="prod-desc"></p>

                <div id="specs-block" style="display:none;">
                    <div class="section-title">Specificații</div>
                    <table class="specs-table" id="specs-table"></table>
                </div>
            </div>

            <!-- Detalii -->
            <div class="product-details">
                <h1 id="prod-name"></h1>
                <div class="product-sku" id="prod-sku"></div>

                <div class="price-block">
                    <span class="price-main" id="prod-price"></span>
                    <span class="price-original" id="prod-original" style="display:none;"></span>
                </div>

                <div id="stock-badge" class="stock-badge stock-ok"></div>

                <div class="qty-add" id="qty-add-block">
                    <div class="qty-control">
                        <button onclick="changeQty(-1)">−</button>
                        <span id="qty-display">1</span>
                        <button onclick="changeQty(1)">+</button>
                    </div>
                    <button class="btn-add-big" id="btn-add" onclick="addToCart()">🛒 Adaugă în Coș</button>
                </div>
            </div>
        </div>
    </div>

    <div id="recommended-section" style="display:none;margin-top:3rem;">
        <h2 class="section-title" style="font-size:1.4rem;">Produse Recomandate</h2>
        <div id="recommended-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1.25rem;margin-top:1rem;"></div>
    </div>

    <div id="error-state" style="display:none;text-align:center;padding:4rem;color:var(--text-secondary);">
        <div style="font-size:3rem;margin-bottom:1rem;">😕</div>
        <h2>Produsul nu a fost găsit</h2>
        <a href="index.html" class="btn btn-primary" style="margin-top:1rem;display:inline-block;">Înapoi la produse</a>
    </div>
</div>

<div class="nav-overlay" id="nav-overlay"></div>
<script src="static/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="static/config.js"></script>
<script src="static/supabase-service.js"></script>
<script src="static/checkout-service.js"></script>
<script>
    let currentProduct = null;

    document.addEventListener('DOMContentLoaded', async () => {
        checkoutService.updateCartUI();
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (!id) { showError(); return; }

        await ensureSupabaseService();
        try {
            const { data, error } = await supabaseService.client
                .from('products')
                .select('*')
                .eq('id', id)
                .single();
            if (error || !data) { showError(); return; }
            currentProduct = data;
            renderProduct(data);
        } catch(e) {
            console.error(e);
            showError();
        }
    });

    function renderProduct(p) {
        document.title = p.name + ' - TechNest';
        document.getElementById('prod-name').textContent = p.name;
        document.getElementById('prod-sku').textContent = p.sku ? 'SKU: ' + p.sku : '';

        const price = p.sale_price || p.price;
        document.getElementById('prod-price').textContent = price.toFixed(2) + ' RON';
        if (p.sale_price) {
            const orig = document.getElementById('prod-original');
            orig.textContent = p.price.toFixed(2) + ' RON';
            orig.style.display = 'inline';
        }

        // Stock
        const badge = document.getElementById('stock-badge');
        if (p.stock <= 0) { badge.textContent = 'Stoc Epuizat'; badge.className = 'stock-badge stock-out'; document.getElementById('btn-add').disabled = true; }
        else if (p.stock <= 10) { badge.textContent = `Stoc Limitat: ${p.stock} buc`; badge.className = 'stock-badge stock-low'; }
        else { badge.textContent = `În Stoc: ${p.stock} buc`; badge.className = 'stock-badge stock-ok'; }

        document.getElementById('prod-desc').textContent = p.description || '';

        // Images
        const images = (p.images && p.images.length > 0) ? p.images : ['https://via.placeholder.com/600x600?text=TechNest'];
        document.getElementById('main-img').src = images[0];
        document.getElementById('main-img').alt = p.name;

        const thumbRow = document.getElementById('thumb-row');
        if (images.length > 1) {
            thumbRow.innerHTML = images.map((src, i) =>
                `<img src="${src}" class="thumb ${i===0?'active':''}" onclick="setMainImage(this,'${src}')" alt="img${i+1}">`
            ).join('');
        }

        // Specs from metadata/attributes
        if (p.attributes && Object.keys(p.attributes).length > 0) {
            const table = document.getElementById('specs-table');
            table.innerHTML = Object.entries(p.attributes).map(([k,v]) =>
                `<tr><td>${k}</td><td>${v}</td></tr>`
            ).join('');
            document.getElementById('specs-block').style.display = 'block';
        }

        document.getElementById('loading-state').style.display = 'none';
        document.getElementById('product-content').style.display = 'block';

        // Produse recomandate
        if (p.recommended_ids && p.recommended_ids.length > 0) {
            loadRecommended(p.recommended_ids);
        }
    }

    async function loadRecommended(ids) {
        try {
            const { data, error } = await supabaseService.client
                .from('products')
                .select('*')
                .in('id', ids)
                .eq('is_active', true);

            if (error || !data || !data.length) return;

            const grid = document.getElementById('recommended-grid');
            grid.innerHTML = data.map(prod => {
                const img = (prod.images && prod.images[0]) || 'https://via.placeholder.com/300x300?text=TechNest';
                const price = prod.sale_price || prod.price;
                return `
                <a href="product.html?id=${prod.id}" style="text-decoration:none;color:inherit;display:block;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:transform 0.2s,border-color 0.2s;" 
                   onmouseover="this.style.transform='translateY(-3px)';this.style.borderColor='var(--primary)'" 
                   onmouseout="this.style.transform='';this.style.borderColor='var(--border)'">
                    <img src="${img}" alt="${prod.name}" style="width:100%;aspect-ratio:1;object-fit:cover;" onerror="this.src='https://via.placeholder.com/300x300'">
                    <div style="padding:0.75rem;">
                        <div style="font-size:0.9rem;font-weight:600;color:var(--text-primary);margin-bottom:0.3rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${prod.name}</div>
                        <div style="color:var(--primary);font-weight:700;">${price.toFixed(2)} RON</div>
                    </div>
                </a>`;
            }).join('');

            document.getElementById('recommended-section').style.display = 'block';
        } catch(e) {
            console.error('Recommended products error:', e);
        }
    }

    function setMainImage(thumb, src) {
        document.getElementById('main-img').src = src;
        document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
        thumb.classList.add('active');
    }

    function changeQty(delta) {
        const el = document.getElementById('qty-display');
        el.textContent = Math.max(1, parseInt(el.textContent) + delta);
    }

    function addToCart() {
        if (!currentProduct) return;
        const qty = parseInt(document.getElementById('qty-display').textContent);
        checkoutService.addToCart({
            id: currentProduct.id,
            name: currentProduct.name,
            price: currentProduct.sale_price || currentProduct.price,
            images: currentProduct.images,
            sku: currentProduct.sku,
        }, qty);
        const btn = document.getElementById('btn-add');
        btn.textContent = '✓ Adăugat!';
        btn.style.background = 'linear-gradient(135deg,#10b981,#059669)';
        setTimeout(() => { btn.textContent = '🛒 Adaugă în Coș'; btn.style.background = ''; }, 1500);
    }

    function showError() {
        document.getElementById('loading-state').style.display = 'none';
        document.getElementById('error-state').style.display = 'block';
    }
</script>
<script src="static/cookie-banner.js"></script>
<script>
    function toggleTheme() {
        const isLight = document.body.classList.toggle('light-mode');
        document.getElementById('theme-toggle').textContent = isLight ? '☀️' : '🌙';
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
    }
    (function() {
        const saved = localStorage.getItem('theme');
        if (saved === 'light') { document.body.classList.add('light-mode'); const btn = document.getElementById('theme-toggle'); if (btn) btn.textContent = '☀️'; }
    })();
</script>
</body>
</html>
